<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Consultation - FLOWLEADS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #1a1a2e;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .back-link {
            text-decoration: none;
            color: #10b981;
            font-weight: 500;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 8rem 5% 4rem;
        }

        .form-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #1a1a2e;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e4e8f0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #10b981;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .form-card {
                padding: 2rem;
            }
            .form-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">FLOWLEADS</a>
        <a href="index.html" class="back-link">&larr; Back</a>
    </nav>

    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>Request a Consultation</h1>
                <p>Let's discuss how we can grow your business</p>
            </div>

            <form id="consultForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Smith">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="john@business.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="(555) 123-4567">
                </div>

                <div class="form-group">
                    <label for="business">Business Name</label>
                    <input type="text" id="business" name="business" required placeholder="Your Business Name">
                </div>

                <div class="form-group">
                    <label for="message">Tell us about your goals</label>
                    <textarea id="message" name="message" placeholder="What are you looking to achieve with SMS automation?"></textarea>
                </div>

                <button type="submit" class="submit-btn">Get Started</button>

                <p class="form-footer">We'll respond within 24 hours</p>
            </form>

            <script>
                document.getElementById('consultForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    const name = document.getElementById('name').value;
                    const email = document.getElementById('email').value;
                    const phone = document.getElementById('phone').value;
                    const business = document.getElementById('business').value;
                    const message = document.getElementById('message').value;

                    const subject = encodeURIComponent('Consultation Request from ' + name);
                    const body = encodeURIComponent(
                        'Name: ' + name + '\n' +
                        'Email: ' + email + '\n' +
                        'Phone: ' + phone + '\n' +
                        'Business: ' + business + '\n\n' +
                        'Goals:\n' + message
                    );

                    window.location.href = 'mailto:hello@flowleads.com?subject=' + subject + '&body=' + body;
                });
            </script>
        </div>
    </div>
</body>
</html>
